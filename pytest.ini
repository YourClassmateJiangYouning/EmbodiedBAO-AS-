[pytest]
# The nine test_bao_*.py files are STANDALONE scripts, not pytest modules: each implements its own
# check()/main() and prints a summary.  They are run by run_all_tests.sh, which is the supported entry
# point.  This file exists so that a bare `pytest` collects them as modules without importing their test
# FUNCTIONS -- the functions take no arguments and call check(), which raises the module's own Failure,
# so pytest would report them as errors rather than as the project's own pass/fail lines.
#
# Anyone who does want pytest to drive them should use run_all_tests.sh, or invoke a single file
# directly:
#     /home/ybh/isaacsim/python.sh test_bao_geometry.py
python_files = test_bao_*.py
python_functions = test_*
# Nothing here needs to be collected as a package; the modules import each other by path.
norecursedirs = _test_tmp assets results logs diag_logs scene_preview lab_logs .git
testpaths = .
# They write under _test_tmp inside the repository, so a read-only checkout fails 16 integration and
# 11 persistence checks with OSError rather than with a real defect.  The summary script says so.
